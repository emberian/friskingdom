[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.0"
# The plan job holds contents: write; do not run it on pull requests.
pr-run-mode = "skip"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Actions in the generated release.yml, pinned to the commit each tag named here pointed at.
# Update by re-resolving the tag and re-running `dist generate`; never run pinact on release.yml.
[dist.github-action-commits]
"actions/checkout" = "11d5960a326750d5838078e36cf38b85af677262" # v4
"actions/download-artifact" = "d3f86a106a0bac45b974a628896c90dbdf5c8093" # v4
"actions/upload-artifact" = "ea165f8d65b6e75b540449e92b4886f43607fa02" # v4
