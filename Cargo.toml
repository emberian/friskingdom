[package]
name = "friskingdom"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/emberian/friskingdom"

[workspace]
members = [
    "crates/frisbee-physics",
    "crates/fk-core",
    "crates/fk-game",
    "crates/fk-ai",
    "crates/fk-render",
    "crates/fk-audio",
    "crates/fk-netcode",
    "crates/fk-ui",
    "crates/fk-season",
    "crates/fk-tutorial",
    "crates/fk-debug",
    "crates/fk-test-utils",
]
resolver = "2"

[workspace.dependencies]
bevy = "0.18"
glam = "0.29"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rand = "0.8"

# Internal crates
frisbee-physics = { path = "crates/frisbee-physics" }
fk-core = { path = "crates/fk-core" }
fk-game = { path = "crates/fk-game" }
fk-ai = { path = "crates/fk-ai" }
fk-render = { path = "crates/fk-render" }
fk-audio = { path = "crates/fk-audio" }
fk-netcode = { path = "crates/fk-netcode" }
fk-ui = { path = "crates/fk-ui" }
fk-season = { path = "crates/fk-season" }
fk-tutorial = { path = "crates/fk-tutorial" }
fk-debug = { path = "crates/fk-debug" }
fk-test-utils = { path = "crates/fk-test-utils" }

[features]
debug = ["dep:fk-debug"]

[[bin]]
name = "friskingdom"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
fk-core = { workspace = true }
fk-game = { workspace = true }
fk-ai = { workspace = true }
fk-render = { workspace = true }
fk-audio = { workspace = true }
fk-ui = { workspace = true }
fk-season = { workspace = true }
fk-tutorial = { workspace = true }
fk-debug = { workspace = true, optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
